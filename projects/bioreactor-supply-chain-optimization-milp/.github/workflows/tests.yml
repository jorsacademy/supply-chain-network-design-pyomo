name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install CBC solver
        run: sudo apt-get update && sudo apt-get install -y coinor-cbc

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest

      - name: Run deterministic example
        run: python bioreactor_supply_chain.py

      - name: Run robust procurement example
        run: python robust_procurement_model.py

      - name: Run Bertsimas-Sim budgeted robust example
        run: python budgeted_robust_procurement_model.py
